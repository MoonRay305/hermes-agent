name: LibreOffice guard

# The LibreOffice wrapper (skills/productivity/powerpoint/scripts/office/soffice.py)
# against a real LibreOffice. The regular test slices skip these tests because
# LibreOffice is not installed there. This job installs it, creates two
# unprivileged users for the cross-user tests, refuses to continue if any of
# those tests would skip, and then runs the mutation check: every guard is
# weakened in turn and at least one test must go red.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: libreoffice-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice-guard:
    name: LibreOffice guard (real LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install LibreOffice Calc
        uses: ./.github/actions/retry
        with:
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc gcc

      - name: Create two unprivileged users
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin hermes-lo-a
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin hermes-lo-b

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Refuse to run with skipped real-LibreOffice tests
        # Every skip condition in tests/skills/test_soffice_wrapper_libreoffice.py
        # and test_excel_author_skill.py, asserted up front.
        run: |
          source .venv/bin/activate
          python - <<'EOF'
          import shutil
          from tests.skills._soffice_support import can_switch_users, libreoffice_available, other_users
          assert libreoffice_available(), "LibreOffice is not installed"
          assert shutil.which("gcc"), "gcc is not installed"
          assert can_switch_users(), "cannot run as another user"
          users = [u.pw_name for u in other_users(2)]
          assert users == ["hermes-lo-a", "hermes-lo-b"], users
          print("real-LibreOffice tests will run as", users)
          EOF

      - name: Run LibreOffice guard tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh \
            tests/skills/test_soffice_wrapper.py \
            tests/skills/test_soffice_wrapper_libreoffice.py \
            tests/skills/test_excel_author_skill.py \
            tests/skills/test_libreoffice_launch_policy.py

      - name: Mutation check (each weakened guard must turn a test red)
        run: |
          source .venv/bin/activate
          python scripts/check_soffice_guard_mutations.py --strict
